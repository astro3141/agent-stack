# Which workflow packages this instance runs, and where each one comes from.
#
# Installing a package is a decision to trust it: scripts/up.sh applies its principals.yaml, which
# creates identities and mints their credentials (OPERATIONS §27). So a package is pinned like a
# dependency — named source, named ref — and config/packages.lock records the commit that was
# actually installed. `scripts/packages.sh verify` answers whether what is on disk is still that.
#
#   from: local     it lives in this repository, under packages/<name>; this repo's history is its
#                   history. The example and the capability trials stay here — what this repository
#                   can publish about itself, and nothing else.
#   from: <git url> it lives in its own repository and is fetched into packages/<name>, which is
#                   then git-ignored here. **This is the recommendation** (docs/packages.md): a
#                   package that carries domain content, names something real, or snapshots another
#                   repository's files is written in its own repository from the start. Splitting
#                   afterwards leaves the content in this repository's history.
#
# The fetch happens on the **host**, never in a container: a git credential inside the governed
# runtime would be a new thing for the agent to reach, and there is no reason for it.
packages:
  hello-lane:
    from: local
    note: the example that shows the contract
  auto:
    from: local
    note: capability trial — a file task through the routing layer
  research-r:
    from: local
    note: capability trial — #280's Phase R with routed model steps
  novel:
    from: local
    note: capability trial — role-split chapter with a bounded repair loop
