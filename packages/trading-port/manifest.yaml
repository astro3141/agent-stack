# The paper-trading harness's arch cycle, as a package.
#
# Ported onto this stack on the `port/trading-harness` branch, and rearranged here into the shape
# a workflow travels in (OPERATIONS §27): its own graph, steps, prompts and fixtures under one
# directory, so another machine installs the stack, copies this in, and runs it.
name: trading-port
version: 0.1.0
description: >
  The harness arch cycle (B + E + G + F desk + H) decided together from one bridged ResearchPacket.
  Pilot mode runs from a committed fixture with invented numbers; live mode takes a packet the
  harness froze outside this runtime.
entry: workflow.yaml
requires:
  # Without these a run of this package is refused rather than degraded (p281/capabilities.py).
  capabilities: [tool_rights, egress, record, admission]
  # Platform steps this package calls by design — the capabilities, not behaviour:
  #   steps/route.py     quota admission        steps/roles.py   bind lanes to vendors
  #   steps/tasks.py     the fan-out            steps/record.py  one record per run and call
  # And one that is NOT a platform capability: steps/trade_stage.py belongs to the built-in
  # trading-b workflow, and this package reuses its `validate` so every lane is checked the same
  # way. That is a dependency on another workflow's code, and until it moves this package is not
  # self-contained. It is written down rather than hidden (README).
  platform_steps: [route.py, roles.py, tasks.py, record.py, trade_stage.py]
