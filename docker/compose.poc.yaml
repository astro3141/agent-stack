# #278 PoC — governed runtime, isolated from the host's daily Claude installation.
#
# Network design (per review):
#   governed  : internal, NO route to the internet. The agent lives here only.
#   provision : ordinary bridge, attached TEMPORARILY for credential minting only.
#
# The Preloop containers (api / console / gateway) are attached to `governed` out of
# band with `docker network connect`, because they are owned by the upstream release
# compose in ~/.preloop-oss and are not redefined here.
name: ${STACK:-cadp278}

networks:
  # UX track: the ops API's own network (nothing else joins it; the UI will).
  opsnet:
    name: ${STACK:-cadp278}-opsnet
  # #281 option B: internet side of the routing layer's allowlist proxy.
  egressnet:
    name: ${STACK:-cadp278}-egressnet
  # #281 quota observer: ordinary bridge (egress) for the observer ONLY. The agent is never on
  # it; observations reach the agent through a read-only volume, not over the network.
  quotanet:
    name: ${STACK:-cadp278}-quotanet
  governed:
    name: ${STACK:-cadp278}-governed
    internal: true
  provision:
    name: ${STACK:-cadp278}-provision
  # Inbound-only path for the operator's browser to reach MLflow. Measured:
  # a published port does NOT work on an `internal: true` network in this Docker
  # version (docker port reports no mapping), so MLflow is dual-homed here.
  # This grants egress to MLFLOW ONLY. The agent stays single-homed on `governed`,
  # and no container runs a forwarder or proxy, so this does not give the agent a
  # route out. Recorded in FINDINGS.md F9.
  observe:
    name: ${STACK:-cadp278}-observe
  # The underlying MCP tool lives here. The agent is deliberately NOT a member,
  # so the only route from the agent to the tool is through Preloop's MCP safety
  # layer. Preloop's api container is attached out of band.
  toolnet:
    name: ${STACK:-cadp278}-toolnet
    internal: true
  # The admin side of Preloop: the api / console / gateway containers live here, together with
  # the guard that fronts them for the governed network and the panel that answers approvals.
  # The agent is NOT a member — that is the whole point (OPERATIONS.md §20).
  adminnet:
    name: ${STACK:-cadp278}-adminnet
    internal: true

volumes:
  agent-home:
    name: ${STACK:-cadp278}-agent-home
  # #281 option B: the workspace the agent works in, also mounted (same path) in fsmcp so
  # file tools served over MCP act on the same files.
  ws:
    name: ${STACK:-cadp278}-ws
  # #281 quota observer: its own credentials (a separate login lineage), and the observation
  # files it writes (mounted read-only in the agent).
  quota-home:
    name: ${STACK:-cadp278}-quota-home
  # #281 option B: the routing layer's own provider logins (a lineage separate from the
  # credentials Preloop custodies), mounted in the agent at /route.
  route-creds:
    name: ${STACK:-cadp278}-route-creds
  quota-obs:
    name: ${STACK:-cadp278}-quota-obs

services:
  agent:
    build:
      context: .
      dockerfile: agent.Dockerfile
    image: cadp278/governed-runtime:local
    container_name: ${STACK:-cadp278}-agent
    # PID 1 here is the service itself, and a service is not a reaper: every provider CLI
    # the adapter starts and every child the file server spawns is left as a zombie when
    # its parent exits. Measured after two days of runs — agent 111, file server 550 — and
    # they only ever accumulate. `init: true` puts tini in front, which reaps them.
    init: true
    restart: unless-stopped
    networks:
      - governed
    volumes:
      # The PoC workspace, shared with the host so evidence stays inspectable.
      - type: bind
        source: ${POC_HOST_DIR:-..}
        target: /work
      # The #280 research workspace, kept separate from the PoC workspace.
      - type: bind
        source: ${RESEARCH_HOST_DIR:-../evidence/research}
        target: /research
      # Container-only HOME. The host's ~/.claude is NEVER mounted here.
      - agent-home:/home/agent
      - ws:/ws
      - quota-obs:/obs:ro
      - route-creds:/route
    # The credentials of the role principals a workflow may ask for (mcp_principal). Operator
    # supplied, never versioned (docker/.gitignore), and the adapter reads them from the
    # environment rather than storing any of them.
    env_file:
      - path: principals.env
        required: false
    environment:
      POC_DIR: /work
      POC_PY: /opt/venv/bin/python
      PYTHONUTF8: "1"
      # Preloop control plane, reached over the governed network by service name.
      PRELOOP_URL: http://console
      # Traces go to the in-network MLflow, not the host.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://mlflow:5000
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_HEADERS: x-mlflow-experiment-id=1
      OTEL_SERVICE_NAME: cadp-commodity-composition-poc
    # No published port, and it would not work if there were one: this container is single-homed
    # on an internal network, where Docker does not apply port bindings (the same measurement that
    # made MLflow dual-homed, above). That is also the answer to "can the operator open Conductor's
    # run dashboard": not without giving the agent a second, non-internal network — see
    # OPERATIONS.md §12.
    command: ["sleep", "infinity"]

  mlflow:
    build:
      context: .
      dockerfile: mlflow.Dockerfile
    image: cadp278/mlflow:3.16.1
    container_name: ${STACK:-cadp278}-mlflow
    init: true
    restart: unless-stopped
    # Recording is a capability a composition may leave out (scripts/up.sh --composition).
    profiles: ["record"]
    networks:
      - governed
      - observe
    volumes:
      - type: bind
        source: ${POC_HOST_DIR:-..}/evidence/mlflow
        target: /mlflow
    environment:
      # MLflow rejects Host headers outside localhost/private-IP by default
      # (DNS-rebinding protection). In-network clients address it as `mlflow:5000`,
      # so that name has to be allowed explicitly. Measured: without this, OTLP
      # ingest answers 403 "Invalid Host header".
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow,mlflow:5000,localhost,localhost:${MLFLOW_PORT:-5000},127.0.0.1,127.0.0.1:${MLFLOW_PORT:-5000}"
      # This stack uses MLflow to log runs and keep artifacts — nothing submits server-side jobs.
      # Left on, 3.16.1 starts a fleet of huey consumers (measured: 18 processes, workers
      # 10+10+5+2+10+5) and the container was the largest in the stack by a wide margin.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      MLFLOW_SERVER_JOB_ENABLE_PERIODIC_TASKS: "false"
    ports:
      # Inbound only. Publishing a port does not give any container egress,
      # so this does not weaken the N7 claim.
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --workers 1

  toolsvc:
    build:
      context: .
      dockerfile: toolsvc.Dockerfile
    image: cadp278/toolsvc:local
    container_name: ${STACK:-cadp278}-toolsvc
    init: true
    restart: unless-stopped
    networks:
      toolnet:
        # instance-independent name: the Preloop policy addresses the tool servers by it
        aliases: [toolsvc]
    volumes:
      - type: bind
        source: ${POC_HOST_DIR:-..}/evidence/n1-markers
        target: /markers

  # #281 option B: filesystem MCP behind Preloop. On toolnet only: the agent cannot reach it
  # except through Preloop's MCP proxy, which is where the rules are evaluated.
  fsmcp:
    build:
      context: .
      dockerfile: fsmcp.Dockerfile
    image: cadp278/fsmcp:local
    container_name: ${STACK:-cadp278}-fsmcp
    init: true
    restart: unless-stopped
    networks:
      toolnet:
        # instance-independent name: the Preloop policy addresses the tool servers by it
        aliases: [fsmcp]
    volumes:
      - ws:/ws

  # #281 quota observer. Same image (codex, CodexBar), different network, volume and logins.
  # Holds provider credentials and has egress, so it runs no service and joins no network the
  # agent is on; it only writes observation files into quota-obs.
  quota:
    image: cadp278/governed-runtime:local
    container_name: ${STACK:-cadp278}-quota
    init: true
    restart: unless-stopped
    networks:
      - quotanet
    volumes:
      - quota-home:/home/agent
      - quota-obs:/obs
      - type: bind
        source: ${POC_HOST_DIR:-..}/p281/observer_loop.sh
        target: /opt/p281/observer_loop.sh
        read_only: true
    # the observation loop is the container's process, so it comes back with every restart
    command: ["sh", "/opt/p281/observer_loop.sh"]

  # #281 option B: the routing layer's egress — allowlisted provider hosts only.
  egress:
    build:
      context: .
      dockerfile: egress.Dockerfile
    image: cadp278/egress:local
    container_name: ${STACK:-cadp278}-egress
    init: true
    restart: unless-stopped
    networks:
      governed:
        aliases: [egress]
      egressnet: {}

  # The approval boundary as a route: on the governed network this holds the names the agent
  # resolves for Preloop (api, console, gateway), and it refuses the two requests that would let
  # the governed party answer its own approval. Everything else passes through untouched.
  apiguard:
    image: nginx:1.27-alpine
    container_name: ${STACK:-cadp278}-apiguard
    init: true
    restart: unless-stopped
    networks:
      governed:
        # the agent's settings name Preloop by these; the names now resolve to this proxy
        aliases: [api, console, gateway]
      adminnet: {}
    volumes:
      - type: bind
        source: ${POC_HOST_DIR:-..}/docker/apiguard.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true

  # UX track: the only component with Docker control — a fixed set of actions over HTTP.
  # Published on 127.0.0.1 only, which narrows who can reach it, not what it can do.
  ops:
    build:
      context: ..
      dockerfile: docker/ops.Dockerfile
    image: cadp278/ops:local
    container_name: ${STACK:-cadp278}-ops
    init: true
    restart: unless-stopped
    # The screen is optional in a reduced composition; runs still start from the CLI.
    profiles: ["ui"]
    networks:
      - opsnet
      # the panel answers approvals itself: the agent's route to Preloop refuses that, and the
      # panel is where the person is (OPERATIONS.md §20)
      - adminnet
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # the approval code and the record it appends to; the panel holds no other part of the tree
      - type: bind
        source: ${POC_HOST_DIR:-..}
        target: /work
      # read-only, and only for the Preloop credential under it: this build gives a second
      # credential the same rights, so the panel is separated from the runtime by its route
      - type: volume
        source: agent-home
        target: /home/agent
        read_only: true
    env_file:
      # PRELOOP_OPERATOR_TOKEN — a credential of the operator's own, if they make one. Absent,
      # the panel uses the hook credential it can read below, which this build cannot separate
      # by rights anyway.
      - path: operator.env
        required: false
    environment:
      OPS_AGENT_CONTAINER: ${STACK:-cadp278}-agent
      # Preloop, addressed on the admin side — past the guard, which is what makes a decision
      # possible from here and impossible from the agent
      P281_PRELOOP_API: http://preloop-api:8000
      P281_CREDENTIAL_HOME: /home/agent
      # only so the panel can link to the consoles that own approvals and run comparison
      PRELOOP_CONSOLE_PORT: ${PRELOOP_CONSOLE_PORT:-3000}
      MLFLOW_PORT: ${MLFLOW_PORT:-5000}
      REPLAY_PORT: ${REPLAY_PORT:-8785}
    ports:
      - "127.0.0.1:${OPS_PORT:-8781}:8781"

  # Conductor's own run dashboard, for runs this stack has already recorded. It runs *here*
  # rather than in the agent because the agent is single-homed on an internal network, where a
  # published port does nothing (OPERATIONS.md §14). It holds no credentials, has no Docker
  # access, and mounts the workspace read-only: it renders an event log and nothing else.
  replay:
    image: cadp278/governed-runtime:local
    container_name: ${STACK:-cadp278}-replay
    init: true
    restart: unless-stopped
    profiles: ["ui"]
    networks:
      - opsnet
    volumes:
      - type: bind
        source: ${POC_HOST_DIR:-..}
        target: /work
        read_only: true
    # No published port: a person reaches this through the hub, which is the one address for
    # the panel. That also keeps the container holding the workspace mount off the browser's side.
    entrypoint: ["/home/agent/.local/share/uv/tools/conductor-cli/bin/python"]
    command: ["/work/p281/tools/replay_serve.py", "${REPLAY_PORT:-8785}"]

  # UX track: the UI. Talks only to the ops API; holds no Docker access and no credentials.
  hub:
    build:
      context: ..
      dockerfile: docker/hub.Dockerfile
    image: cadp278/hub:local
    container_name: ${STACK:-cadp278}-hub
    init: true
    restart: unless-stopped
    # The screen is optional in a reduced composition; runs still start from the CLI.
    profiles: ["ui"]
    networks:
      - opsnet
    environment:
      HUB_OPS_URL: http://${STACK:-cadp278}-ops:8781
      HUB_REPLAY_URL: http://${STACK:-cadp278}-replay:${REPLAY_PORT:-8785}
    ports:
      - "127.0.0.1:${HUB_PORT:-8780}:8780"
