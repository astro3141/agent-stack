# Attaches Preloop's api / console / gateway to the PoC networks, with the aliases the agent
# resolves. Replaces the out-of-band `docker network connect` step, which did not survive a
# restart or recreate of the Preloop containers. Used as an extra compose file on top of the
# upstream Preloop install (~/.preloop-oss): see scripts/up.sh.
#
# `default` is listed explicitly because naming any network replaces a service's implicit one.
# The PoC networks are created by compose.poc.yaml, so the PoC stack comes up first.
#
# Published ports are NOT here. They belong to Preloop's own compose file, which scripts/install.sh
# makes instance-aware once (the numbers become ${PRELOOP_*_PORT} with Preloop's own as defaults).
# Publishing them here as well bound each port twice — the two lists merge rather than replace, and
# the second bind fails (measured on a host running another Preloop). One owner, and it is theirs.
#
# The keys below are fixed (compose does not substitute variables in a service's network keys);
# the network each one resolves to follows STACK. The defaults are the
# live instance, so a restored copy runs beside it under another name and other ports
# (scripts/restore.sh) — which is how a restore is verified without touching the instance in use.
services:
  api:
    networks:
      default: {}
      # NOT poc-governed: the agent reaches Preloop only through the guard, which is what holds
      # the name `api` there and refuses approval decisions (docker/apiguard.conf, OPERATIONS §20)
      poc-admin:
        # both names on the admin side: `preloop-api` is what the guard forwards to, and
        # `api` is what the operator's own toolchain already calls it (OPERATIONS §21)
        aliases: [preloop-api, api]
      poc-toolnet:
        aliases: [api]
  console:
    networks:
      default: {}
      poc-admin:
        # both names on the admin side: `preloop-console` is what the guard forwards to, and
        # `console` is what the operator's own toolchain already calls it (OPERATIONS §21)
        aliases: [preloop-console, console]
  gateway:
    networks:
      default: {}
      poc-admin:
        # both names on the admin side: `preloop-gateway` is what the guard forwards to, and
        # `gateway` is what the operator's own toolchain already calls it (OPERATIONS §21)
        aliases: [preloop-gateway, gateway]

networks:
  poc-admin:
    external: true
    name: ${STACK:-cadp278}-adminnet
  poc-toolnet:
    external: true
    name: ${STACK:-cadp278}-toolnet
