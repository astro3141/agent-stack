# The approval boundary, as a route.
#
# An approval is the one decision this stack reserves for a person. In Preloop OSS 0.15.0 the
# rights that would express that are not available: an API key resolves to its owning *user*, tool
# rights are per subject but API rights are per role, and this build exposes no way to add a second
# user to an account (measured: /api/v1/users, /api/v1/invitations and /api/v1/teams all 404, and
# /auth/register creates a new account whose user is its owner). So the runtime's credential
# carries `decide_approvals` and nothing inside Preloop can take it away.
#
# What is ours is the *route*. The agent is single-homed on the governed network; this proxy holds
# the names it resolves there (api, console, gateway) and is the only way from it to Preloop. The
# decisions below are refused here, whatever credential is presented.
#
# This is weaker than a rights-based separation and must not be described as more: anyone holding
# the runtime's credential from another network position can still decide. It is what this version
# of Preloop allows to be enforced, and it is measurable from inside the agent (ops_health.py).
# What the governed network may not do. `$uri` is the decoded path, so an encoded form of the
# same request matches the same rule. Everything not named here passes through.
map "$request_method $uri" $guard_refusal {
    default                                                                     "";
    # Reads are untouched: the governed side may see what it is waiting for and what it may do.
    "~^(GET|HEAD|OPTIONS) "                                                     "";
    # The two writes the runtime legitimately makes. The permission hook calls permission-check on
    # every native tool call, and MCP itself is a POST to the console's /mcp/v1.
    "~^POST /api/v1/agents/permission-check$"                                   "";
    "~^POST /mcp/v1"                                                            "";
    # Named separately because the refusal should say what was actually attempted.
    "~^[A-Z]+ /api/v1/approval-requests/[0-9a-fA-F-]+/(approve|decline|decide)$" "the runtime may not decide approvals";
    "~^[A-Z]+ /api/v1/approval-bypasses"                                        "the runtime may not create or revoke approval bypasses";
    "~^[A-Z]+ /api/v1/(agents/[0-9a-fA-F-]+|auth/api-keys/[0-9a-fA-F-]+|account)/governance" "the runtime may not change tool rights";
    "~^[A-Z]+ /api/v1/(agents$|agents/[0-9a-fA-F-]+|auth/api-keys)"              "the runtime may not mint or revoke credentials";
    # Everything else that would change the control plane. A policy apply, an MCP server, a tool
    # configuration, an approval workflow: all of them change what the account enforces, and the
    # party being governed does not get to do that. Measured first — the Preloop CLI's own
    # `policy apply` succeeded from the agent until this line existed.
    "~^[A-Z]+ /api/v1/"                                                         "the runtime may not change what the account enforces";
}

map $host $preloop_upstream {
    default              "";
    "api"                "http://preloop-api:8000";
    "api:8000"           "http://preloop-api:8000";
    "console"            "http://preloop-console:80";
    "console:80"         "http://preloop-console:80";
    "gateway"            "http://preloop-gateway:8000";
    "gateway:8000"       "http://preloop-gateway:8000";
}

server {
    listen 80;
    listen 8000;
    server_name _;
    resolver 127.0.0.11 ipv6=off valid=30s;
    client_max_body_size 64m;

    # An approval is held open until a person answers, and Preloop gives up at about 302 seconds
    # with `timed_out` — which the adapter reports as "approval expired", a policy outcome. A proxy
    # that cuts at 300 turns that into `control_unavailable`, an infrastructure error, two seconds
    # before the real answer: measured on the second machine, twice, at ms:300155. The adapter goes
    # direct to the api precisely to avoid the console's own 300s, and this guard put it back.
    # Nothing here holds a request open on purpose except this one.
    location = /api/v1/agents/permission-check {
        default_type application/json;
        if ($guard_refusal) {
            return 403 '{"error":"$guard_refusal","by":"apiguard","where":"the governed network"}';
        }
        if ($preloop_upstream = "") { return 421; }
        proxy_pass $preloop_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;      # longer than Preloop's own wait, deliberately
    }

    location / {
        # Refused here, whatever credential is presented. Reading is untouched: the runtime is
        # allowed to see what it is waiting for, and the panel's own dashboard reads the standing
        # bypasses through this same route.
        default_type application/json;   # only reached by the refusal below; a proxied answer keeps its own type
        if ($guard_refusal) {
            return 403 '{"error":"$guard_refusal","by":"apiguard","where":"the governed network"}';
        }
        if ($preloop_upstream = "") { return 421; }   # a name this proxy does not stand for
        proxy_pass $preloop_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # MCP answers over SSE and a tool call can be long: stream it, do not buffer it.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
