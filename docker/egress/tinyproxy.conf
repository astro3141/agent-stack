# #281 option B: the routing layer's own egress. The ONLY way out of agentstack-governed for model
# traffic once the Preloop gateway is no longer the model path. CONNECT to 443 only, and only to
# the provider hosts in /etc/tinyproxy/allow; everything else is refused and logged.
User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Connect
MaxClients 50
ConnectPort 443
# KIS serves its API on 9443 and nothing on 443 (measured: the host reaches 9443, the proxy's
# CONNECT for it was refused while 443 timed out). A port is as much a part of the allowlist as a
# host, so it is named here rather than opened generally (OPERATIONS §36).
ConnectPort 9443
# the same API's paper endpoint (openapivts) serves on 29443; tinyproxy takes no inline comment
# after a value — one on the same line stopped the proxy dead, and with it every provider call
ConnectPort 29443
Filter "/etc/tinyproxy/allow"
FilterType ere
FilterDefaultDeny Yes
FilterURLs Off
DisableViaHeader Yes
