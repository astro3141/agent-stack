name: cold start on linux

# Everything in OPERATIONS §25 was measured on one Windows machine. The scripts guard their single
# Windows-specific call and every image this stack pulls is multi-arch, but "guards it" is not
# "was run there". This runs the same thing a second machine runs — clone, install.sh, up.sh — on
# a host that has none of it, and judges the result by what may fail there and what may not.
#
# A runner has no provider logins, and never will: those are a person's accounts at Anthropic,
# OpenAI and xAI. So the login and quota checks are expected to fail, and only those.

# When it runs. A push to main proves that commit on a clean host; the weekly run catches what
# changes underneath a commit that did not: Preloop's installer, the images this pulls, the
# runner image. Both are the same job as the manual run.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 21 * * 0"   # Monday 06:17 KST

permissions:
  contents: read

jobs:
  cold-start:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The images come to about 11GB (measured), and a runner starts with roughly 14GB free.
      - name: make room
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h / | tail -1

      - name: what this host has
        run: bash scripts/install.sh --check

      # An instance's own library (§101), written before the build as an operator would — pinned,
      # git-ignored — and read back from the image after. pypdf: pure Python, small.
      - name: the instance's own Python library, declared before the build
        run: printf 'pypdf==6.19.0\n' > docker/python/python.local

      - name: install Preloop, build the stack, claim it, check it
        id: install
        continue-on-error: true
        run: set -o pipefail; bash scripts/install.sh 2>&1 | tee /tmp/cold-start.log

      - name: judge the result
        run: |
          python3 - <<'PY'
          import re, sys
          log = open("/tmp/cold-start.log", encoding="utf-8", errors="replace").read()

          # What a machine without provider logins may fail, and nothing else.
          allowed = {"claude /route login", "codex /route login", "grok /route login",
                     "observer codex login", "every provider's state is knowable",
                     "observation fresh (< 10 min)", "the router can choose a provider"}
          failed = [re.sub(r"\s{2,}.*$", "", l.strip()[6:]).strip()
                    for l in log.splitlines() if l.startswith("  FAIL")]
          unexpected = [f for f in failed if f not in allowed]

          # What must be there: the instance claimed itself, the policy went on, the principals
          # were created from the declaration, and the boundary holds.
          required = [
              ('"onboarded": true', "Preloop was claimed and the runtime credential issued"),
              ('"preloop-policy:policy/b-fsmcp.yaml": "applied"', "the account policy was applied"),
              ('"did": "created"', "the declared principals were created"),
              ("ok    runtime may not decide approvals", "the runtime cannot decide approvals"),
              ("ok    runtime may not rewrite them", "the runtime cannot rewrite its rights"),
              ("ok    fsmcp tools work through Preloop", "tools are served through Preloop"),
              ("ok    the account enforces this checkout's policy", "the policy in effect is this checkout's (§97)"),
          ]
          missing = [why for needle, why in required if needle not in log]

          for f in failed:
              print(("expected  " if f in allowed else "UNEXPECTED ") + f)
          for why in missing:
              print("MISSING   " + why)
          if unexpected or missing:
              sys.exit(1)
          print("\nthe stack came up on a host that had none of it; only the provider logins failed")
          PY

      - name: the instance's library is in the image, and the build left what it resolved
        run: |
          set -o pipefail
          docker exec agentstack-agent /opt/venv/bin/python -c 'import pypdf; print("pypdf", pypdf.__version__)' | tee /tmp/pylocal.log
          grep -q '^pypdf 6.19.0$' /tmp/pylocal.log
          docker exec agentstack-agent grep -i '^pypdf==6.19.0' /opt/python/freeze.txt | tee -a /tmp/pylocal.log
          # --check exits 1 here (no logins on a runner); the line is what is measured
          (bash scripts/up.sh --check 2>&1 || true) | grep "the instance's Python libraries are pinned" | tee -a /tmp/pylocal.log
          grep -q "ok    the instance's Python libraries are pinned" /tmp/pylocal.log

      # A server whose process predates the code it serves (§103, #91): made stale by touching a
      # stack file, named by --check, restarted by the bring-up, clean after.
      - name: a stale stack server is named by --check and restarted by up.sh
        run: |
          set -o pipefail
          sleep 1; touch stack/profile_runner.py
          (bash scripts/up.sh --check 2>&1 || true) | grep "the stack's servers run this checkout's code" | tee /tmp/servers.log
          grep -q "FAIL  the stack's servers run this checkout's code" /tmp/servers.log
          (bash scripts/up.sh 2>&1 || true) | grep -E "stack servers started before this code|the stack's servers run this checkout's code" | tee -a /tmp/servers.log
          grep -q "restarting:" /tmp/servers.log
          grep -q "ok    the stack's servers run this checkout's code" /tmp/servers.log

      # The stack is up and nobody is signed in: exactly the `stack` level of scripts/verify.sh —
      # the checks, the three control suites, package locks and controls, one hello-lane run.
      - name: verify at the stack level
        run: set -o pipefail; bash scripts/verify.sh --level stack 2>&1 | tee /tmp/verify.log

      # Two recoveries (§101): a record carries the instance's input and what the venv resolved; a
      # rollback brings the kept image up without a rebuild, verifies the running id is the record's,
      # and restores the input — here, after it was deleted.
      - name: record a release and roll back to it — the kept image comes up unrebuilt, the input comes back
        run: |
          set -o pipefail
          bash scripts/release.sh record --tag cold 2>&1 | tee /tmp/release.log
          grep -q 'instance inputs *docker/python/python.local' /tmp/release.log
          grep -q 'resolved versions (python.freeze)' /tmp/release.log
          rm docker/python/python.local
          # the rollback's checks fail here where the install's do — the logins, nobody signed in —
          # and the rollback exits 1 on them by design (§100): judged by its lines, as the install is
          (bash scripts/release.sh rollback --to cold 2>&1 || true) | tee -a /tmp/release.log
          grep -q 'as recorded, absence included' /tmp/release.log
          grep -q "image agent .*running the release's kept image" /tmp/release.log
          test -f docker/python/python.local
          docker exec agentstack-agent /opt/venv/bin/python -c 'import pypdf'
          python3 - <<'PY'
          import re, sys
          log = open("/tmp/release.log", encoding="utf-8", errors="replace").read()
          after = log[log.index("== rolling back"):]
          allowed = {"claude /route login", "codex /route login", "grok /route login",
                     "observer codex login", "every provider's state is knowable",
                     "observation fresh (< 10 min)", "the router can choose a provider"}
          failed = [re.sub(r"\s{2,}.*$", "", l.strip()[6:]).strip() for l in after.splitlines() if l.startswith("  FAIL")]
          bad = [f for f in failed if f not in allowed]
          for f in failed: print(("expected  " if f in allowed else "UNEXPECTED ") + f)
          ok = "the kept images are up" in after
          print("the rollback said the kept images are up:", ok)
          sys.exit(1 if bad or not ok else 0)
          PY

      - name: keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cold-start-log
          path: |
            /tmp/cold-start.log
            /tmp/verify.log
            /tmp/pylocal.log
            /tmp/servers.log
            /tmp/release.log

      - name: take it down the way an operator would
        if: always()
        run: bash scripts/down.sh --volumes || true

      # What a complete take-down is, measured: the second instance found a quota container, two
      # networks and a volume left behind, and every earlier run had printed "Resource is still in
      # use" into the `|| true` above (OPERATIONS §69 addendum).
      - name: nothing of the instance is left behind
        if: always()
        run: |
          left="$( (docker ps -a --format 'container {{.Names}}' | grep ' agentstack-';
                    docker network ls --format 'network {{.Name}}' | grep ' agentstack-';
                    docker volume ls --format 'volume {{.Name}}' | grep -E ' (agentstack-|preloop-oss_)') || true)"
          if [ -n "$left" ]; then echo "left behind after down.sh --volumes:"; echo "$left"; exit 1; fi
          echo "nothing named for the instance is left: no container, network or volume"
