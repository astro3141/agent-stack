workflow:
  name: p43-trace-only
  description: Model-free trace probe for the Conductor -> MLflow OTLP path
  entry_point: emit
agents:
  - name: emit
    type: script
    command: "${POC_PY:-D:/Work/poc-278/.venv/Scripts/python.exe}"
    args: ["-c", "import json;print(json.dumps({'ok': True}))"]
    output:
      ok:
        type: boolean
    routes:
      - to: $end
output:
  ok: "{{ emit.output.ok }}"
